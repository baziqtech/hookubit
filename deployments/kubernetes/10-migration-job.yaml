# Explicit migration job. Migrations NEVER run on application start
# (ARCHITECTURE.md 41, engineering rule 21) - an app pod that migrates on boot
# turns a rollout into N concurrent migrations against one database.
#
# This file uses generateName, so apply it with `create`, not `apply`:
#
#   kubectl -n hookubit create -f 10-migration-job.yaml
#   kubectl -n hookubit wait --for=condition=complete --timeout=10m job -l app.kubernetes.io/component=migrate
#
# It is intentionally excluded from kustomization.yaml so that `kubectl apply -k`
# on the app manifests can never trigger a schema change.
#
# The image is the `migrate` target of control-api.Dockerfile: the pruned runtime
# image does not contain the Prisma CLI (it is a devDependency), so it cannot run
# `prisma migrate deploy` without reaching out to the npm registry.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: hookubit-migrate-
  namespace: hookubit
  labels:
    app.kubernetes.io/name: hookubit
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: hookubit
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hookubit
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: hookubit
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/shaq/hookubit-control-api:0.1.0-migrate
          imagePullPolicy: IfNotPresent
          # --no-install: npx in a non-TTY silently downloads a missing
          # package. Without it, an image built without the CLI would apply a
          # 5.22-authored migration history using whatever prisma major npm
          # served that morning. Fail loudly instead.
          command: ['npx', '--no-install', 'prisma', 'migrate', 'deploy']
          workingDir: /app/apps/control-api
          env:
            # Prisma reads DATABASE_URL for migrations; it must be the DIRECT
            # connection, never PgBouncer.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: hookubit-database, key: DIRECT_DATABASE_URL }
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: hookubit-database, key: DIRECT_DATABASE_URL }
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
