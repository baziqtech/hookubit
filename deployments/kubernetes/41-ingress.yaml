# Replace both hostnames and the ingressClassName before applying.
#
# Two hosts on purpose. The ingest path is a machine API taking bursts from
# publishers; the dashboard/control host is a browser surface. Separating them
# lets you rate-limit, size bodies and eventually scale them independently -
# and lets ingest survive a WAF rule aimed at the UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hookubit
  namespace: hookubit
  labels:
    app.kubernetes.io/name: hookubit
    app.kubernetes.io/part-of: hookubit
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['webhooks.example.com']
      secretName: hookubit-tls
  rules:
    - host: webhooks.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: control-api
                port: { name: http }
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: control-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port: { name: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hookubit-ingest
  namespace: hookubit
  labels:
    app.kubernetes.io/name: hookubit
    app.kubernetes.io/component: ingest
    app.kubernetes.io/part-of: hookubit
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # PAYLOAD_MAX_BYTES is 1 MiB; the proxy cap sits just above it so an
    # oversized publish is rejected by the application with a useful error
    # rather than by the proxy with a bare 413.
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['ingest.example.com']
      secretName: hookubit-ingest-tls
  rules:
    - host: ingest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingest
                port: { name: http }
