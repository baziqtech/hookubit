# TEMPLATE ONLY - DO NOT COMMIT A FILLED-IN COPY OF THIS FILE.
#
# Every value below is a placeholder. Populate them from your secret manager
# (AWS Secrets Manager, Vault, GCP/Azure secret managers) via External Secrets
# Operator, `kubectl create secret`, or SOPS. ARCHITECTURE.md 42/43.
#
#   kubectl -n webhook-platform create secret generic webhook-platform-database \
#     --from-literal=DATABASE_URL='postgresql://user:pass@pgbouncer.internal:6432/webhook_platform?schema=public&sslmode=require' \
#     --from-literal=DIRECT_DATABASE_URL='postgresql://user:pass@db.internal:5432/webhook_platform?schema=public&sslmode=require' \
#     --from-literal=REDIS_URL='rediss://redis.internal:6379/0'
#
#   kubectl -n webhook-platform create secret generic webhook-platform-app \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 32)"
#
#   kubectl -n webhook-platform create secret generic webhook-platform-data-plane \
#     --from-literal=DATABASE_URL='postgresql://user:pass@pgbouncer.internal:6432/webhook_platform?schema=public&sslmode=require' \
#     --from-literal=ENCRYPTION_KEY="<the SAME value as webhook-platform-app>"
#
# JWT_SECRET and SESSION_SECRET are deliberately NOT in the data-plane Secret.
# ENCRYPTION_KEY IS: the worker decrypts endpoint signing secrets with it and
# refuses to start without it. The control plane encrypted them with the same
# key, so the two Secrets must carry the same value.
# Add --from-literal=REDIS_URL=... only if you actually run Redis; an empty
# value is not the same as an absent one (see the REDIS_URL note below).
#
# DATABASE_URL should point at PgBouncer in production; DIRECT_DATABASE_URL must
# bypass it, because transaction pooling breaks Prisma's DDL and prepared
# statements (ARCHITECTURE.md 36).
apiVersion: v1
kind: Secret
metadata:
  name: webhook-platform-database
  namespace: webhook-platform
  labels:
    app.kubernetes.io/name: webhook-platform
    app.kubernetes.io/part-of: webhook-platform
type: Opaque
stringData:
  # REQUIRED. The platform ships no database and will not start without this.
  DATABASE_URL: 'REPLACE_ME'
  # REQUIRED for migrations. A direct connection, never the pooler.
  DIRECT_DATABASE_URL: 'REPLACE_ME'
  # Optional. Cache and coordination only; losing it costs throughput, not data.
  #
  # If you are NOT using Redis, LEAVE THIS KEY OUT. Do not set it to ''.
  # envFrom projects every key in a Secret as a SET environment variable, so an
  # empty value is not "unset" - the control API's env schema takes an optional
  # URL, which accepts undefined and REJECTS "", and the process throws in
  # validateEnv before it listens. Uncomment the line only with a real URL.
  #
  # REDIS_URL: 'rediss://redis.internal:6379/0'
---
apiVersion: v1
kind: Secret
metadata:
  name: webhook-platform-app
  namespace: webhook-platform
  labels:
    app.kubernetes.io/name: webhook-platform
    app.kubernetes.io/part-of: webhook-platform
type: Opaque
stringData:
  # openssl rand -base64 48
  JWT_SECRET: 'REPLACE_ME'
  SESSION_SECRET: 'REPLACE_ME'
  # openssl rand -base64 32 - must decode to exactly 32 bytes (AES-256-GCM).
  # Rotating this without re-encrypting endpoint secrets makes them unreadable.
  ENCRYPTION_KEY: 'REPLACE_ME'
  # REQUIRED outside development/test. Carries the SMTP password, hence a Secret.
  # smtp:// or smtps:// - `host:587` is refused by the env schema. Without it the
  # control API refuses to boot rather than accept signups nobody can verify.
  SMTP_URL: 'REPLACE_ME'
  # Object storage for oversized payloads (ARCHITECTURE.md 32). Optional, and
  # optional means OMITTED - see the REDIS_URL note above. Uncomment with values.
  #
  # S3_ENDPOINT: 'https://s3.eu-west-1.amazonaws.com'
  # S3_BUCKET: 'webhook-platform-payloads'
  # S3_REGION: 'eu-west-1'
  # S3_ACCESS_KEY: 'REPLACE_ME'
  # S3_SECRET_KEY: 'REPLACE_ME'
---
# The four Go roles get THIS Secret, not webhook-platform-app.
#
# services/data-plane/internal/config/config.go reads DATABASE_URL, REDIS_URL,
# the S3 credentials and ENCRYPTION_KEY, and nothing else. It never reads
# JWT_SECRET or SESSION_SECRET - and the worker, whose entire job is making
# outbound HTTP requests to customer-controlled URLs, is the worst process in
# the system to hold the key that forges a session cookie.
#
# Least privilege here is free: the data plane keeps working, and a compromised
# worker cannot mint an operator session.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-platform-data-plane
  namespace: webhook-platform
  labels:
    app.kubernetes.io/name: webhook-platform
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: webhook-platform
type: Opaque
stringData:
  # Same pooled URL as webhook-platform-database. Keep the two in step, or
  # replace both with one External Secrets / SOPS source.
  DATABASE_URL: 'REPLACE_ME'
  # The SAME value as webhook-platform-app. The control plane encrypts endpoint
  # signing secrets with it; the worker decrypts them with it, and exits at
  # startup (`build decryption keyring: ENCRYPTION_KEY is required`) without it.
  # When you rotate, add ENCRYPTION_KEY_ID / ENCRYPTION_KEYS_RETIRED to BOTH.
  ENCRYPTION_KEY: 'REPLACE_ME'
  # Optional - omit entirely if unused, never set to ''.
  # REDIS_URL: 'rediss://redis.internal:6379/0'
  # S3_ACCESS_KEY: 'REPLACE_ME'
  # S3_SECRET_KEY: 'REPLACE_ME'
