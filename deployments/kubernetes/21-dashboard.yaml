# Static React bundle served by nginx-unprivileged. Stateless by construction;
# in a hosted deployment this is a CDN origin (ARCHITECTURE.md 52).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: webhook-platform
  labels: &labels
    app.kubernetes.io/name: webhook-platform
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: webhook-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-platform
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # nginx-unprivileged runs as uid 101.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dashboard
          image: ghcr.io/shaq/webhook-dashboard:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          # There is no application to be unready for - if nginx answers, it can
          # serve. `/` returns index.html via try_files.
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp bodies under /tmp,
            # and its caches under /var/cache/nginx. Both must be writable even
            # though the root filesystem is not.
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: webhook-platform
  labels:
    app.kubernetes.io/name: webhook-platform
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: webhook-platform
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
  selector:
    app.kubernetes.io/name: webhook-platform
    app.kubernetes.io/component: dashboard
