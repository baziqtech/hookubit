# `kubectl apply -k deployments/kubernetes` deploys the application.
#
# 10-migration-job.yaml is deliberately NOT listed. Schema changes are an
# explicit, separate step (ARCHITECTURE.md 41); no application apply should ever
# be able to migrate the database as a side effect.
#
# 02-secret.template.yaml is deliberately NOT listed either. It contains
# placeholders; create the real Secrets out of band from your secret manager.
#
# RENAMED webhook-platform -> hookubit. If a `webhook-platform` namespace is
# still running these workloads, this is NOT an in-place apply: every selector
# label value changed, and `spec.selector` is IMMUTABLE on a Deployment and on a
# Job, so `kubectl apply` is REJECTED by the API server for each one. Delete the
# old workloads (or the old namespace) and apply this fresh. Nothing durable is
# lost - PostgreSQL is external and none of these manifests own storage - but
# Secrets do not follow a namespace rename, so recreate them from
# 02-secret.template.yaml in `hookubit` FIRST, with the SAME ENCRYPTION_KEY as
# before or no endpoint signing secret in the database can be decrypted.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hookubit

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 20-control-api.yaml
  - 21-dashboard.yaml
  - 30-ingest.yaml
  - 31-router.yaml
  - 32-scheduler.yaml
  - 33-worker.yaml
  - 40-pdb.yaml
  - 41-ingress.yaml
  # Default-deny NetworkPolicies. INCLUDED ON PURPOSE - a security control that
  # is opt-in is a security control nobody has. READ THE HEADER OF THAT FILE
  # BEFORE APPLYING: it is a no-op unless your CNI enforces NetworkPolicy, and
  # it will block the control plane from a database on a PUBLIC address (Neon,
  # Upstash, a public RDS endpoint) until you add that range to
  # `allow-datastore-egress`.
  - 50-networkpolicy.yaml

images:
  - name: ghcr.io/shaq/hookubit-control-api
    newTag: 0.1.0
  - name: ghcr.io/shaq/hookubit-data-plane
    newTag: 0.1.0
  - name: ghcr.io/shaq/hookubit-dashboard
    newTag: 0.1.0
