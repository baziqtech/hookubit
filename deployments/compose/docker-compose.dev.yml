# Development infrastructure ONLY.
#
# PostgreSQL appears here because a laptop needs a database, not because the
# platform ships one. Production must never run PostgreSQL inside this stack
# (ARCHITECTURE.md 36, engineering rule 4) - see docker-compose.prod.yml, which
# has no postgres service and will not start without an external DATABASE_URL.
name: hookubit-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookubit
      POSTGRES_PASSWORD: hookubit
      POSTGRES_DB: hookubit
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hookubit -d hookubit']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for large payloads and oversized response bodies.
  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches every message the control plane sends - verification links, password
  # resets, invitations - so a signup can actually be finished locally. SMTP on
  # 1025, inbox at http://localhost:8025. Point SMTP_URL at it (see
  # docs/LOCAL_SETUP.md); nothing leaves the machine. Not part of any deployment.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8025/livez']
      interval: 5s
      timeout: 3s
      retries: 10

  # A webhook sink to deliver to while developing. Not part of any deployment.
  sink:
    image: mendhak/http-https-echo:34
    environment:
      HTTP_PORT: 8081
    ports:
      - '8081:8081'

volumes:
  postgres-data:
  minio-data:
