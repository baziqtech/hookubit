{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hookubit.serviceAccountName" . }}
  labels:
    {{- include "hookubit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload in this platform talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
