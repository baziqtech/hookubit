{{- if .Values.ingress.enabled }}
{{/*
Two hosts on purpose. The ingest path is a machine API taking publisher bursts;
the app host is a browser surface. Separating them lets you rate-limit, size
bodies and scale them independently - and lets ingest survive a WAF rule aimed
at the UI.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hookubit.fullname" . }}
  labels:
    {{- include "hookubit.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.appHost | quote }}
      secretName: {{ .Values.ingress.tls.appSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.appHost | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "hookubit.fullname" . }}-control-api
                port:
                  name: http
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "hookubit.fullname" . }}-control-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hookubit.fullname" . }}-dashboard
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hookubit.fullname" . }}-ingest
  labels:
    {{- include "hookubit.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
  annotations:
    # payload.maxBytes is 1 MiB; the proxy cap sits just above it so an
    # oversized publish is rejected by the application with a useful error
    # rather than by the proxy with a bare 413.
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.ingestHost | quote }}
      secretName: {{ .Values.ingress.tls.ingestSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.ingestHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hookubit.fullname" . }}-ingest
                port:
                  name: http
{{- end }}
