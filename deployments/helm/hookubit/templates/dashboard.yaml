apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hookubit.fullname" . }}-dashboard
  labels:
    {{- include "hookubit.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  annotations:
    # WHAT THE IMAGE WAS BUILT WITH, not what this chart configures. The bundle
    # is static and Vite inlined these at image build time; nginx reads no
    # environment, so nothing at deploy time can change them (values.yaml,
    # dashboard.build). Recorded here so `kubectl describe` answers "why does
    # the get-started curl point at localhost" without unpacking the image.
    hookubit.shaq.io/built-with-ingest-base-url: {{ dig "build" "ingestBaseUrl" "" .Values.dashboard | default "<unset: bundle falls back to http://localhost:8080>" | quote }}
    hookubit.shaq.io/built-with-api-transport: {{ dig "build" "apiTransport" "" .Values.dashboard | default "<unset: bundle default is mock>" | quote }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "hookubit.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hookubit.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "hookubit.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        # nginx-unprivileged runs as uid 101.
        {{- include "hookubit.podSecurityContext" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "hookubit.image" (dict "ctx" . "image" .Values.dashboard.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Static assets: if nginx answers, it can serve. `/` returns
          # index.html via try_files.
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            {{- include "hookubit.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp bodies in /tmp and
            # its caches in /var/cache/nginx; both must be writable even though
            # the root filesystem is not.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
      {{- with (.Values.dashboard.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dashboard.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookubit.fullname" . }}-dashboard
  labels:
    {{- include "hookubit.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "hookubit.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
