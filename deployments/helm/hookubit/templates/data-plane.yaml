{{/*
The four Go roles. One image, one build, one version, one credential set to
rotate - the role is chosen by argv (ADR-0005). They are still independently
scalable, which is the property that actually matters.
*/}}
{{- $roles := list
      (dict "name" "ingest"    "cfg" .Values.dataPlane.ingest    "grace" 60 "strategy" "RollingUpdate" "http" true)
      (dict "name" "router"    "cfg" .Values.dataPlane.router    "grace" 60 "strategy" "RollingUpdate" "http" false)
      (dict "name" "scheduler" "cfg" .Values.dataPlane.scheduler "grace" 60 "strategy" "Recreate"      "http" false)
      (dict "name" "worker"    "cfg" .Values.dataPlane.worker    "grace" 90 "strategy" "RollingUpdate" "http" false)
-}}
{{- $root := . -}}
{{- range $role := $roles }}
{{- $autoscaled := and (hasKey $role.cfg "autoscaling") $role.cfg.autoscaling.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hookubit.fullname" $root }}-{{ $role.name }}
  labels:
    {{- include "hookubit.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role.name }}
spec:
  {{- if not $autoscaled }}
  replicas: {{ $role.cfg.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: {{ $role.strategy }}
    {{- if eq $role.strategy "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ if eq $role.name "worker" }}2{{ else }}1{{ end }}
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "hookubit.selectorLabels" (dict "ctx" $root "component" $role.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hookubit.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $role.name }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
        {{- if $root.Values.observability.prometheusAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ include "hookubit.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # webhookd's in-process drain budget is 25s (cmd/webhookd/main.go
      # shutdownGrace) and a single outbound attempt can run for
      # egress.totalTimeoutMs. Stay comfortably above both, or SIGKILL lands
      # mid-attempt and the delivery waits out its lease before being reclaimed.
      terminationGracePeriodSeconds: {{ $role.grace }}
      securityContext:
        # distroless nonroot.
        {{- include "hookubit.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: webhookd
          image: {{ include "hookubit.image" (dict "ctx" $root "image" $root.Values.dataPlane.image "defaultTag" $root.Chart.AppVersion) }}
          imagePullPolicy: {{ $root.Values.dataPlane.image.pullPolicy }}
          args: [{{ $role.name | quote }}]
          ports:
            {{- if $role.http }}
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- end }}
            - name: probes
              containerPort: 9090
              protocol: TCP
          # The data plane's own Secret: DATABASE_URL, REDIS_URL, the S3
          # credentials and ENCRYPTION_KEY (the worker decrypts endpoint signing
          # secrets with it and refuses to start without it). JWT_SECRET and
          # SESSION_SECRET are not projected here - the worker makes outbound
          # HTTP to customer-controlled URLs and is the worst place in the
          # system to hold the session-forgery key.
          envFrom:
            {{- include "hookubit.dataPlaneEnvFrom" $root | nindent 12 }}
          {{- if $root.Values.dataPlane.startupProbe.enabled }}
          # ── STARTUP ────────────────────────────────────────────────────────
          # The third probe, and the one that was missing. While it is running,
          # the liveness probe is suspended, so a pod that is slow to bind - a
          # cold node, a throttled CPU limit, an image just pulled - is given
          # failureThreshold x periodSeconds to get there instead of being
          # restarted by a liveness check that started counting at 5 seconds.
          #
          # It targets /health/live, NOT /health/ready, and that is deliberate:
          # startup is "did this process bind its port", never "can it reach
          # PostgreSQL". Pointing it at readiness would make a database outage
          # exhaust the threshold and kill every pod - reinventing, at startup,
          # exactly the fleet-wide restart that ARCHITECTURE.md 46 keeps
          # liveness off the database to avoid.
          #
          # This is one half of the boot-outage fix. The other half is in Go and
          # has landed: webhookd binds the probe server BEFORE opening the pool
          # and waits for PostgreSQL with backoff (db.OpenWithRetry), instead of
          # pinging first and exiting 1 without ever binding :9090. A probe
          # cannot rescue a container that has already exited, so neither half
          # works alone - and a process that stays up retrying would be killed
          # by liveness without this probe. Readiness reports "starting" through
          # the wait, so no traffic is sent until the pool is usable.
          startupProbe:
            httpGet: { path: /health/live, port: probes }
            periodSeconds: {{ $root.Values.dataPlane.startupProbe.periodSeconds }}
            timeoutSeconds: {{ $root.Values.dataPlane.startupProbe.timeoutSeconds }}
            failureThreshold: {{ $root.Values.dataPlane.startupProbe.failureThreshold }}
          {{- end }}
          # Liveness never touches PostgreSQL (ARCHITECTURE.md 46).
          livenessProbe:
            httpGet: { path: /health/live, port: probes }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness does check PostgreSQL, and flips to draining on SIGTERM so
          # work stops arriving before the process winds down.
          #
          # Only ingest is behind a Service, so for the other three roles this
          # is a status signal rather than a traffic one - which is why it is
          # allowed to depend on the database and liveness is not.
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            {{- toYaml $role.cfg.resources | nindent 12 }}
          securityContext:
            {{- include "hookubit.containerSecurityContext" $root | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $root.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $role.http }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookubit.fullname" $root }}-{{ $role.name }}
  labels:
    {{- include "hookubit.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role.name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: probes
      port: 9090
      targetPort: probes
      protocol: TCP
  selector:
    {{- include "hookubit.selectorLabels" (dict "ctx" $root "component" $role.name) | nindent 4 }}
{{- end }}
{{- end }}
