apiVersion: v2
name: webhook-platform
description: >-
  Multi-tenant webhook delivery platform. Brings its own control plane, data
  plane and dashboard; brings NO database - PostgreSQL is external and required.
type: application
version: 0.1.0
appVersion: '0.1.0'
kubeVersion: '>=1.25.0-0'
keywords: [webhooks, delivery, events, nestjs, go]
home: https://github.com/shaq/webhook-platform
sources:
  - https://github.com/shaq/webhook-platform
maintainers:
  - name: ShaQ Express Platform
annotations:
  # There are deliberately no chart dependencies. A bundled PostgreSQL subchart
  # is the single fastest way to lose a customer's delivery history to a
  # `helm uninstall` (ARCHITECTURE.md 36, engineering rule 4/34).
  artifacthub.io/containsSecurityUpdates: 'false'
