{{- include "webhook-platform.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webhook-platform.fullname" . }}-config
  labels:
    {{- include "webhook-platform.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.env | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  ALLOW_OPEN_REGISTRATION: {{ .Values.app.allowOpenRegistration | quote }}
  CONTROL_API_URL: {{ .Values.app.publicUrl | quote }}
  DASHBOARD_URL: {{ .Values.app.publicUrl | quote }}
  CORS_ORIGINS: {{ .Values.app.publicUrl | quote }}

  CONTROL_API_PORT: "3000"
  INGEST_PORT: "8080"
  DATA_PLANE_METRICS_PORT: "9090"
  DATABASE_MAX_CONNECTIONS: {{ .Values.externalDatabase.maxConnections | quote }}

  WORKER_CONCURRENCY: {{ .Values.dataPlane.worker.concurrency | quote }}
  WORKER_POLL_INTERVAL_MS: {{ .Values.dataPlane.worker.pollIntervalMs | quote }}
  WORKER_CLAIM_BATCH_SIZE: {{ .Values.dataPlane.worker.claimBatchSize | quote }}
  DELIVERY_LEASE_SECONDS: {{ .Values.dataPlane.worker.leaseSeconds | quote }}
  OUTBOX_POLL_INTERVAL_MS: {{ .Values.dataPlane.outbox.pollIntervalMs | quote }}
  OUTBOX_BATCH_SIZE: {{ .Values.dataPlane.outbox.batchSize | quote }}

  MAX_CONCURRENCY_GLOBAL: {{ .Values.concurrency.global | quote }}
  MAX_CONCURRENCY_PER_ORG: {{ .Values.concurrency.perOrg | quote }}
  MAX_CONCURRENCY_PER_PROJECT: {{ .Values.concurrency.perProject | quote }}
  MAX_CONCURRENCY_PER_ENDPOINT: {{ .Values.concurrency.perEndpoint | quote }}

  EGRESS_DNS_TIMEOUT_MS: {{ .Values.egress.dnsTimeoutMs | quote }}
  EGRESS_CONNECT_TIMEOUT_MS: {{ .Values.egress.connectTimeoutMs | quote }}
  EGRESS_TLS_TIMEOUT_MS: {{ .Values.egress.tlsTimeoutMs | quote }}
  EGRESS_RESPONSE_HEADER_TIMEOUT_MS: {{ .Values.egress.responseHeaderTimeoutMs | quote }}
  EGRESS_TOTAL_TIMEOUT_MS: {{ .Values.egress.totalTimeoutMs | quote }}
  EGRESS_MAX_RESPONSE_BYTES: {{ .Values.egress.maxResponseBytes | quote }}
  EGRESS_MAX_REDIRECTS: {{ .Values.egress.maxRedirects | quote }}
  EGRESS_ALLOW_PRIVATE_NETWORKS: {{ .Values.egress.allowPrivateNetworks | quote }}
  EGRESS_PRIVATE_ALLOWLIST: {{ .Values.egress.privateAllowlist | quote }}

  PAYLOAD_INLINE_MAX_BYTES: {{ .Values.payload.inlineMaxBytes | quote }}
  PAYLOAD_MAX_BYTES: {{ .Values.payload.maxBytes | quote }}

  S3_ENDPOINT: {{ .Values.objectStorage.endpoint | quote }}
  S3_BUCKET: {{ .Values.objectStorage.bucket | quote }}
  S3_REGION: {{ .Values.objectStorage.region | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.objectStorage.forcePathStyle | quote }}

  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | quote }}
  OTEL_SERVICE_NAMESPACE: {{ .Values.observability.serviceNamespace | quote }}
{{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
