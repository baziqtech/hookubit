{{/*
The four Go roles. One image, one build, one version, one credential set to
rotate - the role is chosen by argv (ADR-0005). They are still independently
scalable, which is the property that actually matters.
*/}}
{{- $roles := list
      (dict "name" "ingest"    "cfg" .Values.dataPlane.ingest    "grace" 60 "strategy" "RollingUpdate" "http" true)
      (dict "name" "router"    "cfg" .Values.dataPlane.router    "grace" 60 "strategy" "RollingUpdate" "http" false)
      (dict "name" "scheduler" "cfg" .Values.dataPlane.scheduler "grace" 60 "strategy" "Recreate"      "http" false)
      (dict "name" "worker"    "cfg" .Values.dataPlane.worker    "grace" 90 "strategy" "RollingUpdate" "http" false)
-}}
{{- $root := . -}}
{{- range $role := $roles }}
{{- $autoscaled := and (hasKey $role.cfg "autoscaling") $role.cfg.autoscaling.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webhook-platform.fullname" $root }}-{{ $role.name }}
  labels:
    {{- include "webhook-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role.name }}
spec:
  {{- if not $autoscaled }}
  replicas: {{ $role.cfg.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: {{ $role.strategy }}
    {{- if eq $role.strategy "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ if eq $role.name "worker" }}2{{ else }}1{{ end }}
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "webhook-platform.selectorLabels" (dict "ctx" $root "component" $role.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webhook-platform.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $role.name }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
        {{- if $root.Values.observability.prometheusAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ include "webhook-platform.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # webhookd's in-process drain budget is 25s (cmd/webhookd/main.go
      # shutdownGrace) and a single outbound attempt can run for
      # egress.totalTimeoutMs. Stay comfortably above both, or SIGKILL lands
      # mid-attempt and the delivery waits out its lease before being reclaimed.
      terminationGracePeriodSeconds: {{ $role.grace }}
      securityContext:
        # distroless nonroot.
        {{- include "webhook-platform.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: webhookd
          image: {{ include "webhook-platform.image" (dict "ctx" $root "image" $root.Values.dataPlane.image "defaultTag" $root.Chart.AppVersion) }}
          imagePullPolicy: {{ $root.Values.dataPlane.image.pullPolicy }}
          args: [{{ $role.name | quote }}]
          ports:
            {{- if $role.http }}
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- end }}
            - name: probes
              containerPort: 9090
              protocol: TCP
          # The data plane's own Secret: only DATABASE_URL, REDIS_URL and the
          # S3 credentials, which is everything internal/config/config.go reads.
          # JWT_SECRET and SESSION_SECRET are not projected here - the worker
          # makes outbound HTTP to customer-controlled URLs and is the worst
          # place in the system to hold the session-forgery key.
          envFrom:
            {{- include "webhook-platform.dataPlaneEnvFrom" $root | nindent 12 }}
          # Liveness never touches PostgreSQL (ARCHITECTURE.md 46).
          livenessProbe:
            httpGet: { path: /health/live, port: probes }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness does check PostgreSQL, and flips to draining on SIGTERM so
          # work stops arriving before the process winds down.
          readinessProbe:
            httpGet: { path: /health/ready, port: probes }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            {{- toYaml $role.cfg.resources | nindent 12 }}
          securityContext:
            {{- include "webhook-platform.containerSecurityContext" $root | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $root.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $role.http }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhook-platform.fullname" $root }}-{{ $role.name }}
  labels:
    {{- include "webhook-platform.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role.name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: probes
      port: 9090
      targetPort: probes
      protocol: TCP
  selector:
    {{- include "webhook-platform.selectorLabels" (dict "ctx" $root "component" $role.name) | nindent 4 }}
{{- end }}
{{- end }}
