{{- if .Values.migrations.enabled }}
{{/*
Deliberately NOT a Helm hook.

A pre-install/pre-upgrade hook would make every `helm upgrade` - including one
that only changes a log level - capable of altering the schema. Migrations are
an explicit operator step (ARCHITECTURE.md 41, engineering rule 21), and they
never run on application start.

The job name carries the release revision so a second run at the same revision
fails loudly rather than silently doing nothing (Jobs are immutable).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "webhook-platform.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "webhook-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "webhook-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "webhook-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "webhook-platform.podSecurityContext" (dict "uid" 1000) | nindent 8 }}
        fsGroup: 1000
      containers:
        - name: migrate
          # The `migrate` target of control-api.Dockerfile. The pruned runtime
          # image has no Prisma CLI (it is a devDependency) and would try to
          # fetch it from npm at run time.
          image: {{ include "webhook-platform.image" (dict "ctx" . "image" .Values.migrations.image "defaultTag" (printf "%s-migrate" .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          # --no-install: npx in a non-TTY silently fetches a missing package
          # from the registry. Without it, an image built without the CLI would
          # apply a 5.22-authored migration history with whatever prisma major
          # npm served that morning.
          command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
          workingDir: /app/apps/control-api
          envFrom:
            {{- include "webhook-platform.envFrom" . | nindent 12 }}
          env:
            # There is deliberately NO DATABASE_URL override here.
            #
            # schema.prisma declares directUrl = env("DIRECT_DATABASE_URL"), so
            # Prisma already routes migrations around the pooler on its own, and
            # DIRECT_DATABASE_URL arrives through envFrom above - from
            # externalDatabase.existingSecret when one is set, from the chart
            # Secret otherwise.
            #
            # The previous DATABASE_URL entry rendered the URL as a literal
            # `value:`. That was wrong twice over: an `env:` entry OVERRIDES
            # envFrom for the same key,
            # so it silently defeated existingSecret and inverted the documented
            # precedence; and it wrote the database credential in plaintext into
            # the Job PodSpec, into `helm get manifest`, and into the release
            # history stored in etcd.
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- include "webhook-platform.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
