{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook-platform.serviceAccountName" . }}
  labels:
    {{- include "webhook-platform.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload in this platform talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
