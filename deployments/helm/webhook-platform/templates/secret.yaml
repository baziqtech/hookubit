{{/*
One chart-managed Secret. Every key here is overridden by an existingSecret
listed after it in envFrom, so pointing at External Secrets / Vault / SOPS
does not require emptying this file.

Nothing sensitive is ever defaulted: an unset key renders empty, and the
control plane refuses to boot on an empty JWT_SECRET or ENCRYPTION_KEY.

OPTIONAL KEYS ARE OMITTED, NOT EMPTIED. envFrom projects every key in a Secret
as a SET environment variable, so `REDIS_URL: ""` is not "unset" to the process
that reads it - it is an empty string, and the control API's env schema
(`z.string().url().optional()`) accepts undefined but REJECTS "". Rendering the
key unconditionally therefore made the documented "install without Redis" path
produce a control plane that throws in validateEnv before it listens. Anything
optional below is wrapped in an `if`: unset means unset, for every consumer.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webhook-platform.fullname" . }}-secrets
  labels:
    {{- include "webhook-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # External PostgreSQL. Required - this chart ships no database.
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  # Migrations must bypass PgBouncer; falls back to DATABASE_URL.
  DIRECT_DATABASE_URL: {{ default .Values.externalDatabase.url .Values.externalDatabase.directUrl | quote }}
  {{- if .Values.externalRedis.url }}
  # Optional. Cache and coordination only.
  REDIS_URL: {{ .Values.externalRedis.url | quote }}
  {{- end }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  # Never defaulted to jwtSecret: one key signing both API tokens and session
  # cookies means rotating either one invalidates both, and a leak of one is a
  # leak of the other. The validate guard requires it.
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- if .Values.objectStorage.accessKey }}
  S3_ACCESS_KEY: {{ .Values.objectStorage.accessKey | quote }}
  {{- end }}
  {{- if .Values.objectStorage.secretKey }}
  S3_SECRET_KEY: {{ .Values.objectStorage.secretKey | quote }}
  {{- end }}
{{- if .Values.dataPlane.separateSecret }}
{{/*
The data plane gets its own Secret carrying ONLY the keys
services/data-plane/internal/config/config.go actually reads. The worker makes
outbound HTTP to customer-controlled URLs; it is the worst place in the system
to hold the key that forges sessions, and it has no use for it.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webhook-platform.fullname" . }}-data-plane-secrets
  labels:
    {{- include "webhook-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- if .Values.externalRedis.url }}
  REDIS_URL: {{ .Values.externalRedis.url | quote }}
  {{- end }}
  {{- if .Values.objectStorage.accessKey }}
  S3_ACCESS_KEY: {{ .Values.objectStorage.accessKey | quote }}
  {{- end }}
  {{- if .Values.objectStorage.secretKey }}
  S3_SECRET_KEY: {{ .Values.objectStorage.secretKey | quote }}
  {{- end }}
{{- end }}
