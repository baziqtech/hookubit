apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webhook-platform.fullname" . }}-dashboard
  labels:
    {{- include "webhook-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "webhook-platform.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webhook-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "webhook-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        # nginx-unprivileged runs as uid 101.
        {{- include "webhook-platform.podSecurityContext" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "webhook-platform.image" (dict "ctx" . "image" .Values.dashboard.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Static assets: if nginx answers, it can serve. `/` returns
          # index.html via try_files.
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            {{- include "webhook-platform.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # nginx-unprivileged keeps its pid file and temp bodies in /tmp and
            # its caches in /var/cache/nginx; both must be writable even though
            # the root filesystem is not.
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
      {{- with (.Values.dashboard.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dashboard.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhook-platform.fullname" . }}-dashboard
  labels:
    {{- include "webhook-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "webhook-platform.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
