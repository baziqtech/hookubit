# ---------------------------------------------------------------------------
# webhook-platform
#
# THE RULE: containers are disposable, customer data is not.
#
# This chart installs six workloads and no database. PostgreSQL is external,
# required, and supplied by you - RDS/Aurora, Cloud SQL, Azure, Neon, Supabase
# or self-managed. `helm uninstall` deletes every pod and loses nothing.
#
# Redis is optional and holds cache and coordination state only. If it is wiped,
# throughput degrades; nothing that was accepted is lost.
# ---------------------------------------------------------------------------

nameOverride: ''
fullnameOverride: ''

global:
  # Prefix for all three images. Override for an internal registry mirror.
  imageRegistry: ghcr.io/shaq
  imagePullSecrets: []
  # Applied to every pod. Useful for a dedicated node pool.
  nodeSelector: {}
  tolerations: []

# --- REQUIRED: external PostgreSQL ------------------------------------------
# There is no default. values.schema.json rejects an install without a url, on
# purpose: a chart that starts without a database only fails later, in the dark.
externalDatabase:
  # url: 'postgresql://user:pass@pgbouncer.internal:6432/webhook_platform?schema=public&sslmode=require'
  #
  # Production topology is app -> PgBouncer -> PostgreSQL (ARCHITECTURE.md 36).
  # Point `url` at the pooler.

  # Migrations must bypass the pooler: transaction pooling breaks DDL and the
  # session-scoped advisory lock Prisma takes, which can leave a migration half
  # applied and a _prisma_migrations row stuck in `failed`.
  #
  # Empty falls back to `url`. The chart refuses to render the migration Job on
  # that fallback (see migrations.enabled) unless DIRECT_DATABASE_URL comes from
  # externalDatabase.existingSecret instead.
  directUrl: ''

  # Per-pod pool size. The data plane opens this many per pod, and every pod
  # that cannot Ping the pool at startup exits 1 - so an oversized value turns a
  # traffic spike into CrashLoopBackOff instead of throughput.
  #
  # Ceiling at these defaults: (worker maxReplicas 8 + ingest 2 + router 2 +
  # scheduler 1) x 10 = 130 backend connections, plus the control API's Prisma
  # pool. That fits a PgBouncer in front of a modestly tuned PostgreSQL. Raise
  # this or worker.autoscaling.maxReplicas only after checking the product
  # against `max_connections` / `default_pool_size`, not before.
  maxConnections: 10

  # Read the URL from a Secret you manage (External Secrets, SOPS, Vault) rather
  # than from values. The Secret must contain DATABASE_URL, and DIRECT_DATABASE_URL
  # if migrations are run from this chart. `url` is still required above - keep
  # the two in step, or set `url` to the same value and let the Secret win.
  existingSecret: ''

# --- Optional: external Redis -----------------------------------------------
externalRedis:
  # Empty disables Redis entirely. The platform runs without it, more slowly.
  url: ''
  existingSecret: ''

# --- Application secrets -----------------------------------------------------
# Leave the values empty and set `existingSecret` for anything beyond a demo.
# Generate: openssl rand -base64 48  (jwt/session), openssl rand -base64 32 (encryption)
secrets:
  existingSecret: ''
  jwtSecret: ''
  # REQUIRED, and deliberately not defaulted to jwtSecret. One key signing both
  # API tokens and session cookies means rotating either invalidates both, and
  # a leak of either is a leak of both.
  sessionSecret: ''
  # AES-256-GCM key for endpoint signing secrets. Must decode to exactly 32
  # bytes. Changing it without re-encrypting makes every stored secret unreadable.
  encryptionKey: ''

# --- Optional: object storage for oversized payloads (ARCHITECTURE.md 32) ----
objectStorage:
  endpoint: ''
  bucket: ''
  region: us-east-1
  accessKey: ''
  secretKey: ''
  forcePathStyle: false

app:
  env: production
  logLevel: info
  # Self-serve signup. Off by default; the first owner is created explicitly
  # (ADR-0006 - no default credentials, ever).
  allowOpenRegistration: false
  # Public URLs. Used for CORS and for links in outbound email.
  publicUrl: 'https://webhooks.example.com'

# Outbound HTTP limits (ARCHITECTURE.md 31). Never unbounded.
egress:
  dnsTimeoutMs: 2000
  connectTimeoutMs: 3000
  tlsTimeoutMs: 3000
  responseHeaderTimeoutMs: 10000
  totalTimeoutMs: 30000
  maxResponseBytes: 65536
  maxRedirects: 0
  # SSRF guard (ARCHITECTURE.md 30).
  #
  # THIS CANNOT BE ENABLED IN PRODUCTION. The data plane refuses to start when
  # EGRESS_ALLOW_PRIVATE_NETWORKS is true and APP_ENV=production, and app.env
  # defaults to production - so setting this true is not "less safe", it is a
  # data plane that will not boot. The chart now fails at render time rather
  # than letting you find that out from four CrashLoopBackOffs.
  #
  # For a self-hosted install delivering to consumers on your own network, use
  # privateAllowlist with specific CIDRs. It works in production.
  allowPrivateNetworks: false
  privateAllowlist: ''

# Tenant fairness ceilings (ARCHITECTURE.md 24).
concurrency:
  global: 512
  perOrg: 128
  perProject: 64
  perEndpoint: 16

payload:
  inlineMaxBytes: 65536
  maxBytes: 1048576

observability:
  otlpEndpoint: ''
  serviceNamespace: webhook-platform
  # Adds prometheus.io/scrape annotations to data-plane pods.
  prometheusAnnotations: true

# Free-form extra environment for every workload. Anything sensitive belongs in
# a Secret, not here - this map becomes a ConfigMap.
extraEnv: {}

serviceAccount:
  create: true
  name: ''
  annotations: {}

# --- Control plane ----------------------------------------------------------
controlApi:
  image:
    repository: webhook-control-api
    tag: ''            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 2
  # The control plane can be down without stopping queued deliveries
  # (ARCHITECTURE.md 54) - it is never in the delivery hot path.
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: '1', memory: 768Mi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

dashboard:
  image:
    repository: webhook-dashboard
    tag: ''
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Data plane -------------------------------------------------------------
# All four roles run the SAME image and differ only by argv (ADR-0005).
dataPlane:
  image:
    repository: webhook-data-plane
    tag: ''
    pullPolicy: IfNotPresent

  # Give the four Go roles their own Secret carrying only what
  # internal/config/config.go reads (DATABASE_URL, REDIS_URL, S3 credentials).
  # The worker makes outbound HTTP to customer-controlled URLs; JWT_SECRET and
  # SESSION_SECRET have no business being in its environment. Set false only to
  # go back to the single shared Secret.
  separateSecret: true

  ingest:
    replicaCount: 2
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    podDisruptionBudget: { enabled: true, minAvailable: 1 }

  router:
    replicaCount: 2
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    podDisruptionBudget: { enabled: true, minAvailable: 1 }

  scheduler:
    # Keep at 1. A second scheduler is not incorrect - its work is claimed with
    # SKIP LOCKED - but it is duplicated polling for nothing. Note there is no
    # PDB: a budget over a singleton blocks node drains forever.
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
    podDisruptionBudget: { enabled: false }

  worker:
    # The throughput dial. Scale this, not the control plane.
    replicaCount: 2
    # In-process delivery concurrency per pod. Total in-flight deliveries is
    # roughly replicas x concurrency, bounded by the fairness ceilings above.
    concurrency: 64
    pollIntervalMs: 250
    claimBatchSize: 100
    # A claimed delivery whose lease expires becomes reclaimable by another
    # worker. Must exceed the longest possible attempt (egress.totalTimeoutMs).
    leaseSeconds: 120
    resources:
      requests: { cpu: 250m, memory: 128Mi }
      limits: { cpu: '1', memory: 512Mi }
    autoscaling:
      enabled: true
      minReplicas: 2
      # Bounded by the DATABASE, not by CPU. Each worker pod opens
      # externalDatabase.maxConnections and exits 1 if it cannot Ping the pool
      # at startup, so a ceiling the database cannot serve does not produce
      # throughput - it produces CrashLoopBackOff at exactly the moment traffic
      # spiked. 8 x maxConnections (10) = 80, plus 50 for the other roles.
      # Raise this and maxConnections together, and only against a measured
      # `max_connections` / PgBouncer `default_pool_size`.
      maxReplicas: 8
      # CPU is a proxy, not the signal. Workers are I/O bound; queue depth via
      # prometheus-adapter or KEDA is the right trigger once metrics are wired.
      targetCPUUtilizationPercentage: 70
      # No memory target. Nothing has measured this workload's memory profile,
      # and an unmeasured memory metric scales on Go's heap retention rather
      # than on load - it adds pods that do not help and blocks scale-down of
      # pods that are idle. Set an integer here only with a measurement behind
      # it.
    podDisruptionBudget:
      enabled: true
      # Percentage, because the replica count belongs to the HPA.
      maxUnavailable: 25%

  outbox:
    pollIntervalMs: 250
    batchSize: 200

# --- Ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  annotations: {}
  # Browser surface: dashboard at /, control API at /v1 and /docs.
  appHost: webhooks.example.com
  # Machine write path. A separate host so publisher bursts and browser traffic
  # can be rate-limited, sized and scaled independently.
  ingestHost: ingest.example.com
  tls:
    enabled: true
    appSecretName: webhook-platform-tls
    ingestSecretName: webhook-platform-ingest-tls

# --- Migrations -------------------------------------------------------------
# Disabled by default and NOT a Helm hook, on purpose. Migrations are an
# explicit operator step (ARCHITECTURE.md 41); `helm upgrade` must never be able
# to change the schema as a side effect of a config tweak. See NOTES.txt step 5.
migrations:
  enabled: false
  image:
    # The pruned runtime image has no Prisma CLI (it is a devDependency), so the
    # job runs the `migrate` target of control-api.Dockerfile.
    repository: webhook-control-api
    tag: ''            # defaults to "<appVersion>-migrate"
    pullPolicy: IfNotPresent
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 1Gi }
