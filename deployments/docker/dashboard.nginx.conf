server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No sourcemap is ever served. apps/dashboard/vite.config.ts sets
    # build.sourcemap: false, so there should be nothing to match; this is the
    # second line of defence for an image built with --sourcemap, where the map
    # is ~2.9 MB of complete frontend source at a guessable URL.
    #
    # A regex on purpose: it outranks the plain /assets/ prefix below, which is
    # where a map would land. That is also why /assets/ is not written `^~` —
    # `^~` there would stop this rule from being considered at all.
    location ~ \.map$ {
        return 404;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers on a stale bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
