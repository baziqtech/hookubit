# HookuBit — host inventory for Deployer.
#
# The only file you edit. Nothing here is a secret: the secrets live in
# /etc/hookubit/hookubit.env on the server and never pass through Deployer.
#
# To keep your edits out of commits while leaving the file tracked:
#
#     git update-index --skip-worktree deployments/deployer/hosts.yml

config:
  # `dep deploy` deploys a PUSHED ref. Which one.
  branch: main

hosts:
  home:
    # The home server: a hostname, an IP, or (better) an alias from your
    # ~/.ssh/config so the port, key and ProxyJump live where ssh expects them.
    hostname: REPLACE_ME

    # The SSH user that owns releases/. NOT the `hookubit` service user: the
    # service user must not be able to rewrite the code it runs. See the README.
    remote_user: deploy

    # releases/, shared/ and the `current` symlink go here. The systemd units in
    # deployments/deployer/systemd/ hardcode /opt/hookubit/current — change both
    # together.
    deploy_path: /opt/hookubit

    # What the SERVER clones. A read-only GitHub deploy key on the server is the
    # usual answer; agent forwarding also works.
    repository: git@github.com:baziqtech/hookubit.git

    # Must agree with the env file on the server. hookubit:health probes both.
    control_api_port: 3000
    data_plane_metrics_port: 9090

    # Shared across releases, mode 0640 root:hookubit. See the README.
    env_file: /etc/hookubit/hookubit.env

    # Three releases: current, one to roll back to, one for the paranoid.
    keep_releases: 3

    # Where the toolchain lives. nodesource puts the corepack pnpm shim in
    # /usr/bin; the guide untars Go into /usr/local/go.
    bin/pnpm: /usr/bin/pnpm
    bin/go: /usr/local/go/bin/go

    # Privileged commands. `sudo /usr/bin/systemctl` with the sudoers file in
    # deployments/deployer/sudoers.d/hookubit-deploy is the recommendation.
    # Deploying as root instead? Set this to /usr/bin/systemctl.
    bin/systemctl: sudo /usr/bin/systemctl

    # Long pnpm installs and Go builds over a home connection.
    default_timeout: 1800
