# HookuBit — host inventory for Deployer.
#
# The only file you edit. Nothing here is a secret: the secrets live in the three
# env files under <deploy_path>/shared on each server and never pass through
# Deployer.
#
# TWO HOSTS, TWO MACHINES, ONE PER ENVIRONMENT. `dev` and `prod` are separate
# boxes, so nothing between them needs de-conflicting: both listen on the same
# ports, run the same two unit names, and deploy into the same /opt/hookubit.
# Only five values differ, and they are the five below each alias. Everything
# else is in `config:` ONCE, because a dev/prod pair that drifts on `bin/pnpm`
# is a confusing afternoon.
#
# YOU MUST NAME THE HOST. `dep deploy` with no selector is refused by
# hookubit:host:guard, and `make deploy` with no environment is refused by the
# Makefile. Use `make deploy-dev` / `make deploy-prod`, or `dep deploy dev` /
# `dep deploy prod`. See deployments/deployer/README.md, "Two hosts".
#
# THIS FILE IS TRACKED AND CARRIES REAL DETAIL — prod's address and login, and
# both environments' public hostnames. To keep your edits out of commits while
# leaving the file tracked:
#
#     git update-index --skip-worktree deployments/deployer/hosts.yml
#
# That is per-clone and per-checkout, so run it again after a fresh clone. It
# makes git ignore YOUR changes to this file; it does NOT stop what is already
# committed here from being public, and a `git pull` that changes this file will
# fail until you `--no-skip-worktree`, pull, and set it again.

config:
  # --- Identical on both machines. Do not copy any of these into a host block.

  # What the SERVER clones. A read-only GitHub deploy key on each server is the
  # usual answer; agent forwarding also works. There is no per-environment fork:
  # the two hosts deploy two BRANCHES of this one repository.
  repository: git@github.com:baziqtech/hookubit.git

  # releases/, shared/ and the `current` symlink go here, on both boxes. The
  # systemd units in deployments/deployer/systemd/ hardcode
  # /opt/hookubit/current AND the three /opt/hookubit/shared/... EnvironmentFile
  # paths — change them together, on both machines.
  deploy_path: /opt/hookubit

  # Must agree with CONTROL_API_PORT and DATA_PLANE_METRICS_PORT in the two
  # service env files on the server. hookubit:health probes both. The same
  # numbers on both boxes: they are two machines, and :3000 on dev is not :3000
  # on prod.
  control_api_port: 3000
  data_plane_metrics_port: 9090

  # The two systemd units, by name. These must match the FILENAMES in
  # deployments/deployer/systemd/, which is why they are not per-environment:
  # there is one install step and it is the same on both boxes.
  api_unit: hookubit-api
  data_plane_unit: hookubit-data-plane

  # The service user's group, and the group the seeded env files are given.
  # Not cosmetic: see hookubit:env.
  service_group: hookubit

  # Three releases: current, one to roll back to, one for the paranoid.
  keep_releases: 3

  # Where the toolchain lives. nodesource puts the corepack pnpm shim in
  # /usr/bin; the guide untars Go into /usr/local/go.
  bin/pnpm: /usr/bin/pnpm
  bin/go: /usr/local/go/bin/go

  # Privileged commands. `sudo /usr/bin/systemctl` with the sudoers file in
  # deployments/deployer/sudoers.d/hookubit-deploy is the recommendation.
  # Deploying as root instead? Set this to /usr/bin/systemctl.
  bin/systemctl: sudo /usr/bin/systemctl

  # Long pnpm installs and Go builds over a home connection.
  default_timeout: 1800

  # NOT HERE, DELIBERATELY:
  #
  #   branch        per-host, below. A global default here would deploy the same
  #                 ref to both boxes, which is the one thing this pairing
  #                 exists to prevent. hookubit.php sets it EMPTY so an unpinned
  #                 host is refused rather than silently deploying `HEAD`.
  #   env_files     the ordered list hb_env searches. Its ORDER is load-bearing
  #   shared_files  (service-specific beats common, matching both real parsers),
  #                 so it is a contract in hookubit.php, not inventory. It is
  #                 built from {{deploy_path}} above and is already identical on
  #                 both boxes.

hosts:
  # ---------------------------------------------------------------------------
  # dev — pinned to the `dev` branch. THIS MACHINE DOES NOT EXIST YET.
  #
  # Fill in `hostname` before the first deploy. hookubit:host:guard refuses a
  # REPLACE_ME, by name, before anything connects.
  # ---------------------------------------------------------------------------
  dev:
    # A hostname, an IP, or (better) an alias from your ~/.ssh/config so the
    # port, key and ProxyJump live where ssh expects them.
    hostname: REPLACE_ME

    # The ref this box gets, and the whole point of having two. `dep deploy`
    # deploys a PUSHED ref: push to `dev`, then `make deploy-dev`.
    branch: dev

    # The SSH user that owns releases/. NOT the `hookubit` service user: the
    # service user must not be able to rewrite the code it runs. This is the
    # user the README's one-time setup creates. See the README.
    remote_user: deploy

    # The public origin nginx answers the dashboard AND /v1 on. One origin for
    # both: relative `fetch('/v1/...')` then works by construction, there is no
    # CORS, and the session cookie never crosses an origin. Must equal
    # DASHBOARD_URL in <deploy_path>/shared/apps/control-api/.env on THIS box,
    # which is the base of every link in outbound mail.
    dashboard_origin: https://dev.hookubit.com

    # Ingest. A DIFFERENT hostname, because it is the Go data plane and not the
    # control API. Compiled into the bundle as VITE_INGEST_BASE_URL, so changing
    # it needs a rebuild, not a restart — and hookubit:build greps the built JS
    # to prove THIS host's value actually reached vite.
    ingest_base_url: https://hooks.dev.hookubit.com

  # ---------------------------------------------------------------------------
  # prod — pinned to `main`. The live box.
  # ---------------------------------------------------------------------------
  prod:
    hostname: 192.168.100.21
    branch: main
    remote_user: naj
    dashboard_origin: https://hookubit.com
    ingest_base_url: https://hooks.hookubit.com
